<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .scan-band { display: none; }
    }
  </style>

  <rect width="1200" height="260" fill="#1c1c1a"/>

  <!-- faixa de scan -->
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f1ed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f2f1ed" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f2f1ed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="scan-band">
    <rect x="-250" y="0" width="250" height="260" fill="url(#scanGrad)">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="1450 0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- grid de fôrma de concreto -->
  <g stroke="#f2f1ed" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="500" y1="0" x2="500" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="700" y1="0" x2="700" y2="260"/>
    <line x1="800" y1="0" x2="800" y2="260"/>
    <line x1="900" y1="0" x2="900" y2="260"/>
    <line x1="1000" y1="0" x2="1000" y2="260"/>
    <line x1="1100" y1="0" x2="1100" y2="260"/>
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- marcas de espaçador (tie-marks) -->
  <g fill="#8c8c89" opacity="0.2">
    <circle cx="200" cy="65" r="2.5"/>
    <circle cx="400" cy="65" r="2.5"/>
    <circle cx="700" cy="65" r="2.5"/>
    <circle cx="1000" cy="65" r="2.5"/>
    <circle cx="300" cy="130" r="2.5"/>
    <circle cx="900" cy="130" r="2.5"/>
    <circle cx="200" cy="195" r="2.5"/>
    <circle cx="500" cy="195" r="2.5"/>
    <circle cx="800" cy="195" r="2.5"/>
    <circle cx="1000" cy="195" r="2.5"/>
  </g>

  <!-- nome -->
  <text x="600" y="118" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="8" fill="#f2f1ed">JOÃO MANOEL</text>

  <!-- régua -->
  <line x1="430" y1="145" x2="770" y2="145" stroke="#8c8c89" stroke-width="1" opacity="0.6"/>

  <!-- tagline -->
  <text x="600" y="176" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="3" fill="#8c8c89">PROCESSOS · GESTÃO DE PROJETOS · IA APLICADA</text>

  <!-- tags -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" letter-spacing="2">
    <rect x="389" y="205" width="80" height="26" fill="none" stroke="#4a4a48" stroke-width="1"/>
    <text x="429" y="222" text-anchor="middle" fill="#c9c7c0">IFPE</text>

    <rect x="485" y="205" width="140" height="26" fill="none" stroke="#4a4a48" stroke-width="1"/>
    <text x="555" y="222" text-anchor="middle" fill="#c9c7c0">RECIFE · BR</text>

    <rect x="641" y="205" width="170" height="26" fill="none" stroke="#4a4a48" stroke-width="1"/>
    <text x="726" y="222" text-anchor="middle" fill="#c9c7c0">ADMINISTRAÇÃO</text>
  </g>
</svg>
